# Tests run without a profile, and the base config has no fallbacks. Nothing fetches these unless a test sends a
# real bearer token; the JWT security tests point jwk-set-uri at their own key server instead.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:3000
