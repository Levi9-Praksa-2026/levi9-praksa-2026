server:
  port: 8082

spring:
  application:
    name: community-service
  datasource:
    hikari:
      schema: community   # connections start in this schema, so native SQL finds the tables too
  flyway:
    schemas: community
    default-schema: community
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: community
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true

app:
  post-service:
    base-url: ${POST_SERVICE_BASE_URL:http://localhost:8083}
    connect-timeout: 2s
    read-timeout: 5s
