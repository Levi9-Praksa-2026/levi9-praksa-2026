server:
  port: 8082

spring:
  application:
    name: community-service
  datasource:
    hikari:
      schema: community   # connections start in this schema, so native SQL finds the tables too
  flyway:
    schemas: community
    default-schema: community
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: community
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true

app:
  mock-auth:
    enabled: true   # local only: hard-coded admin caller until auth-service issues tokens
