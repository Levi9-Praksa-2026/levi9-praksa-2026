name: Terraform plan

# Shows what Terraform would change. Read-only: it never changes AWS.
on:
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-*.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.2"
  AWS_REGION: eu-central-1
  TF_DIR: infra

jobs:
  plan:
    # Fork PRs can't get an AWS token, so skip them instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write          # ask GitHub for the OIDC token that AWS trades for credentials
      pull-requests: write     # post the plan on the PR

    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - uses: actions/checkout@v5

      - name: AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Write the plan summary
        run: |
          {
            echo "### Terraform plan"
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the plan on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file summary.md --edit-last --create-if-none
