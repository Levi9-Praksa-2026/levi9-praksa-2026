# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Backend build and tests

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'auth-service/**'
      - 'community-service/**'
      - 'gateway/**'
      - 'post-service/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/workflows/maven.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'auth-service/**'
      - 'community-service/**'
      - 'gateway/**'
      - 'post-service/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/workflows/maven.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build, test, and check coverage
        shell: bash
        run: ./mvnw -B --no-transfer-progress --fail-at-end clean verify 2>&1 | tee maven-verify.log
      - name: Generate coverage report and service status
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/coverage_report.py
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: maven-reports
          path: |
            maven-verify.log
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            coverage-report/target/site/jacoco-aggregate/**
          if-no-files-found: warn
          retention-days: 14
