server:
  port: 8083

spring:
  application:
    name: post-service
  cloud:
    aws:
      secretsmanager:
        # Local runs have no AWS credentials or secret to read. Production turns it on with an env var.
        enabled: false
  datasource:
    hikari:
      schema: post   # connections start in this schema, so native SQL finds the tables too
  servlet:
    multipart:
      # Spring's default is 1 MB per file. Per image the limit is ImageUpload.MAX_BYTES (5 MB): bigger files
      # are rejected here with 413 before they are read into memory. A request holds up to 3 images plus JSON.
      max-file-size: 5MB
      max-request-size: 16MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI}   # required: auth-service's internal address; the dev profile falls back to localhost
          issuer-uri: ${APP_PUBLIC_URL}   # required: only checks the iss claim, never fetched (DECISIONS 2026-11-23 probe)
          authorities-claim-name: roles   # ["ADMIN"] -> ROLE_ADMIN, so hasRole("ADMIN") works
          authority-prefix: ROLE_
  flyway:
    schemas: post
    default-schema: post
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: post
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      # Lazy collections (a post's images) are loaded for up to 100 owners at once, so a page of 20 posts
      # costs one extra query for all their images instead of 20.
      hibernate.default_batch_fetch_size: 100

app:
  community-service:
    url: ${COMMUNITY_SERVICE_URL}   # required: community-service's internal address; the dev profile falls back to localhost
  s3:
    bucket: ${S3_BUCKET:levddit-post-images}
    region: ${AWS_REGION:eu-central-1}
