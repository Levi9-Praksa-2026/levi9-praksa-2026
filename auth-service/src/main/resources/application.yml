server:
  port: 8081
  # Behind the gateway, the client's address arrives in X-Forwarded-For. Tomcat reads it from the right, skips
  # private-network hops (the gateway) and uses the first public one as the remote address (rate limits use it).
  forward-headers-strategy: native
  tomcat:
    # Keep a relative Location (/signin) so the browser stays on the origin it is on. An absolute one is built from
    # the scheme and host this service sees, which behind CloudFront, the ALB and the gateway is http:// and can be
    # the ALB's own name, a host the browser can't reach. SignInRedirectTests.
    use-relative-redirects: true
  servlet:
    session:
      # The login session (it lets /oauth2/authorize see who logged in). Not readable by scripts, not sent on
      # cross-site requests, only sent over HTTPS (the dev profile allows plain http://localhost).
      cookie:
        http-only: true
        same-site: lax
        secure: true

spring:
  application:
    name: auth-service
  datasource:
    hikari:
      schema: auth   # connections start in this schema, so native SQL finds the tables too
  flyway:
    schemas: auth
    default-schema: auth
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: auth
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true

app:
  auth:
    # Where the React login page posts email and password (Spring Security's form login).
    login-url: /api/auth/login
  jwt:
    # The public origin the browser sees (frontend, gateway and auth-service share it). Tokens carry it as iss.
    issuer: ${APP_PUBLIC_URL}   # required; the dev profile falls back to http://localhost:3000
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    generate-key: false   # production default; key comes from APP_JWT_PRIVATE_KEY + APP_JWT_KEY_ID
  oauth:
    authorization-cleanup:
      enabled: true
      cron: "0 0 0 * * *" # Daily at midnight UTC; expired tokens get a five-minute grace period.
    gateway-client:
      secret: ${APP_OAUTH_GATEWAY_CLIENT_SECRET:}   # required; startup fails without it
  # Per client IP, refilled gradually (10 per minute = one back every 6 s). DECISIONS.md 2026-11-18.
  # Generous on purpose: everyone in one office shares one IP.
  rate-limit:
    login:
      requests: 10
      per: 1m
    register:
      requests: 10
      per: 1h
