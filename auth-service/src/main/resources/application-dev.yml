# Local development. docker compose turns this profile on; in IntelliJ, put "dev" in the run configuration's
# Active profiles. Never active in production: see docs/production-changes.md.
server:
  servlet:
    session:
      cookie:
        secure: false   # http://localhost has no HTTPS

spring:
  datasource:   # compose's Postgres from the host; inside compose, SPRING_DATASOURCE_* point at the postgres container
    url: jdbc:postgresql://localhost:5432/reddit
    username: reddit
    password: reddit_local

app:
  jwt:
    issuer: ${APP_PUBLIC_URL:http://localhost:3000}
    generate-key: true   # a new key at every start, so a restart logs everyone out; fine locally
  oauth:
    gateway-client:
      secret: ${APP_OAUTH_GATEWAY_CLIENT_SECRET:local-gateway-secret}   # the gateway's dev profile has the same value
