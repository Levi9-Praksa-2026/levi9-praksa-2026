# Tests sign with a key generated in memory, so no key is ever committed.
app.jwt.generate-key=true
# The gateway's client secret, a test value only.
app.oauth.gateway-client.secret=test-gateway-secret
# Tests run without a profile, and the base config has no fallback for the public URL.
app.jwt.issuer=http://localhost:3000

# Cleanup tests invoke the job directly; background deletion must not race test fixtures.
app.oauth.authorization-cleanup.enabled=false

# Rate limits high enough that tests about something else never hit them. Rate-limit tests set their own.
app.rate-limit.login.requests=1000
app.rate-limit.login.per=1m
app.rate-limit.register.requests=1000
app.rate-limit.register.per=1m
