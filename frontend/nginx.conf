# One origin: the React app and the API both answer on this address (http://localhost:3000 locally). React Router
# owns every path except the gateway's, so unknown paths get index.html instead of a 404.
# The proxying is for local runs: in AWS the load balancer (or CloudFront) routes the gateway's paths, and this
# copies it. Keep the list in step with vite.config.ts.
server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # Post images: post-service accepts requests up to 16 MB (spring.servlet.multipart.max-request-size).
  client_max_body_size 16m;

  # Every location below inherits these. Host keeps ":3000", so the gateway and auth-service see the public origin.
  # nginx is the first hop locally, so it sets X-Forwarded-For to the address it saw rather than appending: a
  # client's own header would otherwise give it a fresh login rate limit on every attempt.
  # No X-Forwarded-Host on purpose: the gateway passes it on to auth-service, which then builds its /signin redirect
  # on its own container name (http://auth-service:3000/signin). Measured 2026-11-24.
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # The gateway: API, OAuth login and logout, discovery, and Swagger (dev profile only).
  # /signin and /signup are React pages, so they are not here.
  location /api/           { proxy_pass http://gateway:8080; }
  location /oauth2/        { proxy_pass http://gateway:8080; }
  location /login/oauth2/  { proxy_pass http://gateway:8080; }
  location = /logout       { proxy_pass http://gateway:8080; }
  location /connect/       { proxy_pass http://gateway:8080; }
  location /.well-known/   { proxy_pass http://gateway:8080; }
  location /swagger-ui     { proxy_pass http://gateway:8080; }
  location /v3/api-docs    { proxy_pass http://gateway:8080; }
  location /api-docs/      { proxy_pass http://gateway:8080; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
